[package]
name = "dd_background"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = {version ="0.8.1", features = ["ws"]} # 添加 WebSocket 特性

rbatis = { version = "4.5.48", features = ["default"] }
tokio = { version = "1.43.0", features = ["rt", "macros", "rt-multi-thread", "sync"] }
log = "0.4.24"
serde_json = "1.0.135"
rbs = "4.5.24"
rbdc-pg = "4.5.17"
fast_log = "1.7.6"
serde = { version = "1.0.217", features = ["derive"] }
serde_yaml = "0.9.34"
futures-util = "0.3"  # 用于处理 WebSocket 流
moka = { version = "0.12", features = ["future"] }
